# Two-replica Stancomb PT: cold T=1 + hot T=1.01, exchange ON.
# r200 @ T=1.01: a_swap=0.075 with accepts only after energies meet (~round 180+).
# Longer run so post-burn-in swaps dominate; target neighbor a_swap ~0.2–0.4
# in the second half (Kone & Kofke / Vousden ladder guidance).
# Matched budget with two_replica_stancomb_baseline_cold.yaml.
experiment:
  name: two_replica_stancomb_pt
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 2
  temperatures: [1.0, 1.01]
  batch_n_iterations: 101   # Niya run(n) → n-1 = 100 proposals per round
  rounds: 600               # extend past descent so late swaps accumulate
  warmup_rounds: 0
exchange:
  enabled: true
  pairing: two_replica
logging:
  terminal: true
  log_every_rounds: 10
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 1800   # Stancomb CRF setup often >120s per worker
  output_dir: results/two_replica_stancomb_pt_r600_T1.01
