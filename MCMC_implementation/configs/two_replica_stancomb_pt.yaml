# Two-replica Stancomb PT smoke: T in {1, 2}, exchange ON.
# Same science + batch/rounds as two_replica_stancomb_baseline_cold.yaml.
experiment:
  name: two_replica_stancomb_pt
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 2
  temperatures: [1.0, 2.0]
  batch_n_iterations: 3
  rounds: 2
  warmup_rounds: 0
exchange:
  enabled: true
  pairing: two_replica
logging:
  terminal: true
  log_every_rounds: 1
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 1800   # Stancomb CRF setup often >120s per worker
  output_dir: results/two_replica_stancomb_pt
