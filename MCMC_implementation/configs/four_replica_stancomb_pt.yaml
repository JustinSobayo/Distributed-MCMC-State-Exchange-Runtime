# Phase A target: 4-replica Stancomb PT ladder (NOT runnable on MVP yet).
# MVP pt_coordinator requires sampling.replicas==2 / pairing tworeplica.
# Science intent: cold T=1, hotter T_max=1.35, intermediates so neighbor
# a_swap stays ~0.2–0.4 (unlike dead 2-rung [1,1.5] / [1,1.2]).
# Matched budget with four_replica_stancomb_baseline_cold.yaml.
experiment:
  name: four_replica_stancomb_pt
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 4
  temperatures: [1.0, 1.05, 1.15, 1.35]
  batch_n_iterations: 101   # Niya run(n) → n-1 = 100 proposals per round
  rounds: 600
  warmup_rounds: 0
exchange:
  enabled: true
  pairing: neighbor_odd_even   # Phase A: implement in coordinator
logging:
  terminal: true
  log_every_rounds: 10
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 1800
  output_dir: results/four_replica_stancomb_pt_r600_T1.35
