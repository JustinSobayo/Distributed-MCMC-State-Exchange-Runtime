# 4-replica Stancomb PT ladder: cold T=1 → T_max=1.35, neighbor odd/even swaps.
# Long grocery-run budget (matched with four_replica_stancomb_baseline_cold.yaml).
experiment:
  name: four_replica_stancomb_pt
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 4
  temperatures: [1.0, 1.05, 1.15, 1.35]
  batch_n_iterations: 101   # Niya run(n) → n-1 = 100 proposals per round
  rounds: 2000
  warmup_rounds: 0
exchange:
  enabled: true
  pairing: neighbor_odd_even
logging:
  terminal: true
  log_every_rounds: 20
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 3600   # 4× Stancomb setup can be slow
  output_dir: results/four_replica_stancomb_pt_r2000_T1.35
