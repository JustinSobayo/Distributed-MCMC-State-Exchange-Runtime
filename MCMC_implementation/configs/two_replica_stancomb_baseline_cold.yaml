# Dual-cold Stancomb smoke: two independent T=1 workers, exchange OFF.
# Matched budgets with two_replica_stancomb_pt.yaml for later energy-trace compares.
experiment:
  name: two_replica_stancomb_baseline_cold
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 2
  temperatures: [1.0, 1.0]
  batch_n_iterations: 3      # 2 proposals/batch — short smoke; raise for real benchmarks
  rounds: 2
  warmup_rounds: 0
exchange:
  enabled: false
  pairing: two_replica
logging:
  terminal: true
  log_every_rounds: 1
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 1800   # Stancomb CRF setup often >120s per worker
  output_dir: results/two_replica_stancomb_baseline_cold
