# Dual-cold Stancomb control: two independent T=1 workers, exchange OFF.
# Matched budgets with two_replica_stancomb_pt.yaml (T=[1.0, 1.01], r600).
experiment:
  name: two_replica_stancomb_baseline_cold
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 2
  temperatures: [1.0, 1.0]
  batch_n_iterations: 101   # Niya run(n) → n-1 = 100 proposals per round
  rounds: 600               # matched with PT r600 swap-health run
  warmup_rounds: 0
exchange:
  enabled: false
  pairing: two_replica
logging:
  terminal: true
  log_every_rounds: 10
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 1800   # Stancomb CRF setup often >120s per worker
  output_dir: results/two_replica_stancomb_baseline_cold_r600
