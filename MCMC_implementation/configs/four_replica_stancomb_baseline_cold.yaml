# 4-replica equal-resource control: four independent T=1 chains, exchange OFF.
# Matched replicas/rounds/batch with four_replica_stancomb_pt.yaml.
experiment:
  name: four_replica_stancomb_baseline_cold
  seed: 20251019
  rng_seed: 20251019
  rf_seed: 20251020
  coordinator_seed: 20251118
science:
  problem: stancomb
  backend: cpu
  config: null
  data_dir: MCMC_implementation/data
  sigma_mc: 3.0
  rows: 24
  cols: 24
  resolution: 500.0
sampling:
  replicas: 4
  temperatures: [1.0, 1.0, 1.0, 1.0]
  batch_n_iterations: 101
  rounds: 2000
  warmup_rounds: 0
exchange:
  enabled: false
  pairing: neighbor_odd_even
logging:
  terminal: true
  log_every_rounds: 20
runtime:
  coordinator_host: 127.0.0.1
  coordinator_port: 0
  round_timeout_seconds: 3600
  register_timeout_seconds: 3600   # 4× Stancomb setup can be slow
  output_dir: results/four_replica_stancomb_baseline_cold_r2000
